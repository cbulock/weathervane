services:
  weathervane:
    build: .
    container_name: weathervane
    restart: unless-stopped
    ports:
      - "${HLS_PORT:-8080}:8080"
      # Uncomment for VNC debugging:
      # - "5900:5900"
    environment:
      - LOCATION=${LOCATION:-}
      - SCREEN_WIDTH=${SCREEN_WIDTH:-640}
      - SCREEN_HEIGHT=${SCREEN_HEIGHT:-480}
      - FRAME_SAFE_MARGIN=${FRAME_SAFE_MARGIN:-12}
      - CAPTURE_MODE=${CAPTURE_MODE:-full}
      - FRAMERATE=${FRAMERATE:-15}
      - CAPTURE_WIDTH=${CAPTURE_WIDTH:-640}
      - CAPTURE_HEIGHT=${CAPTURE_HEIGHT:-480}
      - CAPTURE_OFFSET_X=${CAPTURE_OFFSET_X:-0}
      - CAPTURE_OFFSET_Y=${CAPTURE_OFFSET_Y:-0}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-1200k}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-128k}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-ultrafast}
      - ENABLE_GPU=${ENABLE_GPU:-false}
      - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-iHD}
      - VAAPI_QP=${VAAPI_QP:-23}
      - VAAPI_QUALITY=${VAAPI_QUALITY:-4}
      - HLS_SEGMENT_DURATION=${HLS_SEGMENT_DURATION:-4}
      - HLS_LIST_SIZE=${HLS_LIST_SIZE:-5}
      - HLS_PORT=${HLS_PORT:-8080}
      - HLS_ROOT=${HLS_ROOT:-/dev/shm/hls}
      - FFMPEG_ON_DEMAND=${FFMPEG_ON_DEMAND:-true}
      - FFMPEG_IDLE_TIMEOUT=${FFMPEG_IDLE_TIMEOUT:-60}
      - FFMPEG_MANAGER_POLL_INTERVAL=${FFMPEG_MANAGER_POLL_INTERVAL:-2}
      - FFMPEG_STARTUP_GRACE=${FFMPEG_STARTUP_GRACE:-20}
      - FRAMING_DEBUG=${FRAMING_DEBUG:-false}
      - FRAMING_DEBUG_DIR=${FRAMING_DEBUG_DIR:-/tmp/hls/debug}
      - EPG_CHANNEL_ID=${EPG_CHANNEL_ID:-weathervane.retro}
      - EPG_CHANNEL_NAME=${EPG_CHANNEL_NAME:-WeatherVane RetroCast}
      - EPG_CHANNEL_ICON=${EPG_CHANNEL_ICON:-https://weather.com/retro/assets/icon.png}
      - EPG_PROGRAM_TITLE=${EPG_PROGRAM_TITLE:-RetroCast Weather Loop}
      - EPG_PROGRAM_DESCRIPTION=${EPG_PROGRAM_DESCRIPTION:-Continuous Weather Channel RetroCast stream.}
      - TZ=${TZ:-America/New_York}
      - ENABLE_VNC=${ENABLE_VNC:-false}
    # When ENABLE_GPU=true on a Linux host with Intel /dev/dri access, uncomment and adjust:
    # devices:
    #   - "${VAAPI_DEVICE:-/dev/dri/renderD128}:${VAAPI_DEVICE:-/dev/dri/renderD128}"
    # group_add:
    #   - "render"
    shm_size: '2gb'
    tmpfs:
      - /tmp/hls:size=100M
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
